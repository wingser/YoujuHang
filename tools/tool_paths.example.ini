# ============================================================
# 开发工具路径统一配置 —— 模板
#
# 用法：复制为同目录的 tool_paths.ini 后按本机情况修改。
# tool_paths.ini 含本机绝对路径与用户名，已在 .gitignore 中排除，不入库。
# 各工具脚本优先从 tool_paths.ini 读取；找不到时使用脚本内硬编码回退。
# 新增脚本请从该文件读取路径，不要硬编码。
#
# 各工具版本要求见 docs/technical.md 6.1。
# ============================================================

[Wireshark]
install_dir = D:\Program Files\Wireshark
tshark = D:\Program Files\Wireshark\tshark.exe
wireshark = D:\Program Files\Wireshark\Wireshark.exe
dumpcap = D:\Program Files\Wireshark\dumpcap.exe

[Tools]
# --- Go 工具链 ---
# go121 = Go 1.21.13（默认编译工具链，产物兼容 Windows 7）
# 注意：Go 1.22+ 编译产物可能无法在 Windows 7 启动，构建务必用 1.21。
go121 = D:\Git\tools\go-sdk\go121\bin\go.exe
# go_sdk = 备用新版工具链
go_sdk = D:\Git\tools\go-sdk\go\bin\go.exe
# rsrc = 嵌入 manifest/图标（build.bat 自动查找，也可在此指定）
rsrc = C:\Users\<你的用户名>\go\bin\rsrc.exe
# Go 模块缓存 / GOPROXY
go_cache = C:\Users\<你的用户名>\go
goproxy = https://goproxy.cn,direct

# --- Android 逆向辅助（可选）---
jdk17 = D:\Git\tools\jdk17
gradle = D:\Git\tools\gradle
android_sdk = D:\Git\tools\android-sdk

# --- 分析脚本运行环境 ---
# python = 系统 PATH 中的 Python
python = python
# frida = Python 包，用 python -c "import frida" 校验
frida_version = 17.17.0
